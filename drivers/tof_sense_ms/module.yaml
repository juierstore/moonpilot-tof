module_name: Nooploop TOFSense Rangefinder

parameters:
    - group: Sensors
      definitions:
        TOFMS_CFG:
            description:
                short: Serial port for the Nooploop TOFSense rangefinder
                long: |
                    Selects the serial port on which the tof_sense_ms driver is started
                    at boot (MoonPilot board).

                    0: driver disabled
                    1: UART2 RX only, PD6, connector U11 pin 6   (/dev/ttyS1)
                    2: UART4, PB9/PB8, connector U11 pin 3/4     (/dev/ttyS3)

                    Option 2 shares the 6 pin GPS connector: if a GPS is also wired to
                    UART4, use option 1 for the rangefinder instead.

                    The port is opened at boot, so changing this parameter requires a
                    reboot. To switch ports without rebooting, use the shell:
                      tof_sense_ms stop
                      tof_sense_ms start -d /dev/ttyS3 -b 921600
            type: enum
            values:
                0: Disabled
                1: UART2 RX (U11.6, /dev/ttyS1)
                2: UART4 (U11.3/4, /dev/ttyS3)
            default: 1
            reboot_required: true
